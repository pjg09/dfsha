# Entorno local de desarrollo (ADR 0030): el clúster en una sola máquina con las mismas imágenes y las
# mismas direcciones que AWS. No sirve como evidencia: las pruebas mínimas y los experimentos se hacen en
# AWS (ADR 0036).
#
# 1. Secretos (una vez; nunca se versionan, deploy/local/secrets/ está en .gitignore):
#      uv run python -m dfsha.common.pki deploy/local/secrets metadata-1 metadata-2 metadata-3 datanode-1 datanode-2 datanode-3 datanode-4 datanode-5 client-1
# 2. Clúster:
#      DFSHA_VERSION=$(scripts/get-version.sh) DFSHA_IMAGE_TAG=$(scripts/get-version.sh --image) \
#        docker compose -f deploy/local/compose.yaml up -d --build
#
# Cada miembro de etcd tiene el nombre de host de su servidor de metadatos, y el servidor de metadatos
# comparte su red: metadata-1:2379 es etcd y metadata-1:50051 el servicio, igual que en una instancia con
# red del host (ADR 0040). Todas las conexiones usan TLS mutuo (ADR 0043), y cada contenedor solo monta
# los secretos de su host: la clave de envoltura solo la ven los servidores de metadatos (§10.7).
name: dfsha

x-build: &build
  context: ../..
  args:
    DFSHA_VERSION: ${DFSHA_VERSION:-0.0.0}

x-after-secrets: &after-secrets
  secrets-init:
    condition: service_completed_successfully

x-etcd: &etcd
  image: gcr.io/etcd-development/etcd:v3.7.3@sha256:0d27b9478551f431f82d1e0ddb6c87ad07ebae8b904c637f3a99213349523910
  restart: always
  networks: [dfsha-net]
  depends_on: *after-secrets

x-metadata: &metadata
  image: dfsha-metadata:${DFSHA_IMAGE_TAG:-0.0.0}
  build:
    <<: *build
    target: metadata
  restart: always

x-client: &client
  image: dfsha-client:${DFSHA_IMAGE_TAG:-0.0.0}
  build:
    <<: *build
    target: client
  restart: always
  networks: [dfsha-net]
  depends_on: *after-secrets

x-datanode: &datanode
  image: dfsha-datanode:${DFSHA_IMAGE_TAG:-0.0.0}
  build:
    <<: *build
    target: datanode
  restart: always
  networks: [dfsha-net]
  depends_on: *after-secrets

services:
  # Copia los secretos a un volumen, con dueño el usuario de las imágenes (10001) y solo lectura
  secrets-init:
    image: dfsha-client:${DFSHA_IMAGE_TAG:-0.0.0}
    user: root
    entrypoint: ["sh", "-c", "cp -r /source/. /target/ && chown -R 10001:10001 /target && find /target -type d -exec chmod 0500 {} + && find /target -type f -exec chmod 0400 {} +"]
    volumes:
      - ./secrets:/source:ro
      - dfsha-secrets:/target
    restart: "no"

  metadata-1-etcd:
    <<: *etcd
    hostname: metadata-1
    container_name: metadata-1-etcd
    command:
      - etcd
      - --name=metadata-1
      - --data-dir=/data
      - --listen-client-urls=https://[::]:2379
      - --advertise-client-urls=https://metadata-1:2379
      - --listen-peer-urls=https://[::]:2380
      - --initial-advertise-peer-urls=https://metadata-1:2380
      - --initial-cluster=metadata-1=https://metadata-1:2380,metadata-2=https://metadata-2:2380,metadata-3=https://metadata-3:2380
      - --initial-cluster-state=new
      - --cert-file=/run/secrets/dfsha/cert.pem
      - --key-file=/run/secrets/dfsha/key.pem
      - --trusted-ca-file=/run/secrets/dfsha/ca.pem
      - --client-cert-auth
      - --peer-cert-file=/run/secrets/dfsha/cert.pem
      - --peer-key-file=/run/secrets/dfsha/key.pem
      - --peer-trusted-ca-file=/run/secrets/dfsha/ca.pem
      - --peer-client-cert-auth
      - --auto-compaction-mode=periodic
      - --auto-compaction-retention=1h
    volumes:
      - metadata-1-data:/data
      - type: volume
        source: dfsha-secrets
        target: /run/secrets/dfsha
        read_only: true
        volume: {subpath: metadata-1}

  metadata-1:
    <<: *metadata
    container_name: metadata-1
    network_mode: service:metadata-1-etcd
    depends_on: [metadata-1-etcd]
    environment:
      DFSHA_METADATA_ADDR: metadata-1:50051
      DFSHA_ETCD_ADDRS: metadata-1:2379,metadata-2:2379,metadata-3:2379
    volumes:
      - type: volume
        source: dfsha-secrets
        target: /run/secrets/dfsha
        read_only: true
        volume: {subpath: metadata-1}

  metadata-2-etcd:
    <<: *etcd
    hostname: metadata-2
    container_name: metadata-2-etcd
    command:
      - etcd
      - --name=metadata-2
      - --data-dir=/data
      - --listen-client-urls=https://[::]:2379
      - --advertise-client-urls=https://metadata-2:2379
      - --listen-peer-urls=https://[::]:2380
      - --initial-advertise-peer-urls=https://metadata-2:2380
      - --initial-cluster=metadata-1=https://metadata-1:2380,metadata-2=https://metadata-2:2380,metadata-3=https://metadata-3:2380
      - --initial-cluster-state=new
      - --cert-file=/run/secrets/dfsha/cert.pem
      - --key-file=/run/secrets/dfsha/key.pem
      - --trusted-ca-file=/run/secrets/dfsha/ca.pem
      - --client-cert-auth
      - --peer-cert-file=/run/secrets/dfsha/cert.pem
      - --peer-key-file=/run/secrets/dfsha/key.pem
      - --peer-trusted-ca-file=/run/secrets/dfsha/ca.pem
      - --peer-client-cert-auth
      - --auto-compaction-mode=periodic
      - --auto-compaction-retention=1h
    volumes:
      - metadata-2-data:/data
      - type: volume
        source: dfsha-secrets
        target: /run/secrets/dfsha
        read_only: true
        volume: {subpath: metadata-2}

  metadata-2:
    <<: *metadata
    container_name: metadata-2
    network_mode: service:metadata-2-etcd
    depends_on: [metadata-2-etcd]
    environment:
      DFSHA_METADATA_ADDR: metadata-2:50051
      DFSHA_ETCD_ADDRS: metadata-2:2379,metadata-1:2379,metadata-3:2379
    volumes:
      - type: volume
        source: dfsha-secrets
        target: /run/secrets/dfsha
        read_only: true
        volume: {subpath: metadata-2}

  metadata-3-etcd:
    <<: *etcd
    hostname: metadata-3
    container_name: metadata-3-etcd
    command:
      - etcd
      - --name=metadata-3
      - --data-dir=/data
      - --listen-client-urls=https://[::]:2379
      - --advertise-client-urls=https://metadata-3:2379
      - --listen-peer-urls=https://[::]:2380
      - --initial-advertise-peer-urls=https://metadata-3:2380
      - --initial-cluster=metadata-1=https://metadata-1:2380,metadata-2=https://metadata-2:2380,metadata-3=https://metadata-3:2380
      - --initial-cluster-state=new
      - --cert-file=/run/secrets/dfsha/cert.pem
      - --key-file=/run/secrets/dfsha/key.pem
      - --trusted-ca-file=/run/secrets/dfsha/ca.pem
      - --client-cert-auth
      - --peer-cert-file=/run/secrets/dfsha/cert.pem
      - --peer-key-file=/run/secrets/dfsha/key.pem
      - --peer-trusted-ca-file=/run/secrets/dfsha/ca.pem
      - --peer-client-cert-auth
      - --auto-compaction-mode=periodic
      - --auto-compaction-retention=1h
    volumes:
      - metadata-3-data:/data
      - type: volume
        source: dfsha-secrets
        target: /run/secrets/dfsha
        read_only: true
        volume: {subpath: metadata-3}

  metadata-3:
    <<: *metadata
    container_name: metadata-3
    network_mode: service:metadata-3-etcd
    depends_on: [metadata-3-etcd]
    environment:
      DFSHA_METADATA_ADDR: metadata-3:50051
      DFSHA_ETCD_ADDRS: metadata-3:2379,metadata-1:2379,metadata-2:2379
    volumes:
      - type: volume
        source: dfsha-secrets
        target: /run/secrets/dfsha
        read_only: true
        volume: {subpath: metadata-3}

  datanode-1:
    <<: *datanode
    hostname: datanode-1
    container_name: datanode-1
    environment:
      DFSHA_NODE_ID: datanode-1
      DFSHA_DATANODE_ADDR: datanode-1:50052
      DFSHA_METADATA_ADDRS: metadata-1:50051,metadata-2:50051,metadata-3:50051
      DFSHA_INITIALIZE_DATA_DIRECTORY: "true"  # solo en local; en AWS la marca la pone el script de despliegue
    volumes:
      - datanode-1-data:/data
      - type: volume
        source: dfsha-secrets
        target: /run/secrets/dfsha
        read_only: true
        volume: {subpath: datanode-1}

  datanode-2:
    <<: *datanode
    hostname: datanode-2
    container_name: datanode-2
    environment:
      DFSHA_NODE_ID: datanode-2
      DFSHA_DATANODE_ADDR: datanode-2:50052
      DFSHA_METADATA_ADDRS: metadata-1:50051,metadata-2:50051,metadata-3:50051
      DFSHA_INITIALIZE_DATA_DIRECTORY: "true"  # solo en local; en AWS la marca la pone el script de despliegue
    volumes:
      - datanode-2-data:/data
      - type: volume
        source: dfsha-secrets
        target: /run/secrets/dfsha
        read_only: true
        volume: {subpath: datanode-2}

  datanode-3:
    <<: *datanode
    hostname: datanode-3
    container_name: datanode-3
    environment:
      DFSHA_NODE_ID: datanode-3
      DFSHA_DATANODE_ADDR: datanode-3:50052
      DFSHA_METADATA_ADDRS: metadata-1:50051,metadata-2:50051,metadata-3:50051
      DFSHA_INITIALIZE_DATA_DIRECTORY: "true"  # solo en local; en AWS la marca la pone el script de despliegue
    volumes:
      - datanode-3-data:/data
      - type: volume
        source: dfsha-secrets
        target: /run/secrets/dfsha
        read_only: true
        volume: {subpath: datanode-3}

  datanode-4:
    <<: *datanode
    hostname: datanode-4
    container_name: datanode-4
    environment:
      DFSHA_NODE_ID: datanode-4
      DFSHA_DATANODE_ADDR: datanode-4:50052
      DFSHA_METADATA_ADDRS: metadata-1:50051,metadata-2:50051,metadata-3:50051
      DFSHA_INITIALIZE_DATA_DIRECTORY: "true"  # solo en local; en AWS la marca la pone el script de despliegue
    volumes:
      - datanode-4-data:/data
      - type: volume
        source: dfsha-secrets
        target: /run/secrets/dfsha
        read_only: true
        volume: {subpath: datanode-4}

  datanode-5:
    <<: *datanode
    hostname: datanode-5
    container_name: datanode-5
    environment:
      DFSHA_NODE_ID: datanode-5
      DFSHA_DATANODE_ADDR: datanode-5:50052
      DFSHA_METADATA_ADDRS: metadata-1:50051,metadata-2:50051,metadata-3:50051
      DFSHA_INITIALIZE_DATA_DIRECTORY: "true"  # solo en local; en AWS la marca la pone el script de despliegue
    volumes:
      - datanode-5-data:/data
      - type: volume
        source: dfsha-secrets
        target: /run/secrets/dfsha
        read_only: true
        volume: {subpath: datanode-5}

  client-1:
    <<: *client
    hostname: client-1
    container_name: client-1
    environment:
      DFSHA_METADATA_ADDRS: metadata-1:50051,metadata-2:50051,metadata-3:50051
    volumes:
      - client-1-data:/data
      - type: volume
        source: dfsha-secrets
        target: /run/secrets/dfsha
        read_only: true
        volume: {subpath: client-1}

networks:
  dfsha-net:
    name: dfsha-net

volumes:
  dfsha-secrets:
  metadata-1-data:
  metadata-2-data:
  metadata-3-data:
  datanode-1-data:
  datanode-2-data:
  datanode-3-data:
  datanode-4-data:
  datanode-5-data:
  client-1-data:
